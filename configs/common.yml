# Shared training settings from the original wafer experiments.
# Dataset and checkpoint locations are intentionally blank.
task: segmentation
evaluator:
  type: CocoEvaluator
  iou_types:
  - bbox
  - segm
  verbose: false
num_classes: 4
remap_mscoco_category: false
train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: ''
    ann_file: ''
    return_masks: true
    transforms:
      type: Compose
      ops:
      - type: Mosaic
        output_size: 320
        rotation_range: 10
        translation_range:
        - 0.1
        - 0.1
        scaling_range:
        - 0.5
        - 1.5
        fill_value: 0
        max_cached_images: 50
        random_pop: true
      - type: RandomPhotometricDistort
        p: 0.5
      - type: RandomZoomOut
        fill: 0
      - type: RandomIoUCrop
        p: 0.8
      - type: SanitizeBoundingBoxes
        min_size: 1
      - type: RandomHorizontalFlip
      - type: Resize
        size:
        - 640
        - 640
      - type: SanitizeBoundingBoxes
        min_size: 1
      - type: ConvertPILImage
        dtype: float32
        scale: true
      - type: Normalize
        mean:
        - 0.485
        - 0.456
        - 0.406
        std:
        - 0.229
        - 0.224
        - 0.225
      - type: ConvertBoxes
        fmt: cxcywh
        normalize: true
      policy: stop_epoch
      mosaic_epoch: 36
      mosaic_prob: 0.75
      stop_epoch: 72
      remove_ops:
      - Mosaic
      - RandomPhotometricDistort
      - RandomZoomOut
      - RandomIoUCrop
  shuffle: true
  num_workers: 0
  drop_last: true
  collate_fn:
    type: BatchImageCollateFunction
    mixup_prob: 0.75
    mixup_epoch: 36
  total_batch_size: 2
val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: ''
    ann_file: ''
    return_masks: true
    transforms:
      type: Compose
      ops:
      - type: Resize
        size:
        - 640
        - 640
      - type: ConvertPILImage
        dtype: float32
        scale: true
      - type: Normalize
        mean:
        - 0.485
        - 0.456
        - 0.406
        std:
        - 0.229
        - 0.224
        - 0.225
      policy: default
  shuffle: false
  num_workers: 0
  drop_last: false
  collate_fn:
    type: BatchImageCollateFunction
  total_batch_size: 2
model: ECGraph
ECDet:
  backbone: ViTAdapter
  encoder: HybridEncoder
  decoder: ECTransformer
HybridEncoder:
  in_channels:
  - 192
  - 192
  - 192
  feat_strides:
  - 8
  - 16
  - 32
  hidden_dim: 192
  use_encoder_idx:
  - 2
  num_encoder_layers: 1
  nhead: 8
  dim_feedforward: 512
  dropout: 0.0
  expansion: 0.34
  depth_mult: 0.67
  act: silu
  csp_type: csp2
  fuse_op: sum
ECTransformer:
  feat_channels:
  - 192
  - 192
  - 192
  feat_strides:
  - 8
  - 16
  - 32
  hidden_dim: 192
  num_levels: 3
  num_layers: 4
  eval_idx: -1
  num_queries: 300
  num_denoising: 100
  label_noise_ratio: 0.5
  box_noise_scale: 1.0
  reg_max: 32
  reg_scale: 4
  layer_scale: 1
  num_points:
  - 3
  - 6
  - 3
  cross_attn_method: default
  query_select_method: default
  activation: silu
  dim_feedforward: 512
  mask_downsample_ratio: 4
PostProcessor:
  num_top_queries: 300
criterion: ECCriterion
postprocessor: PostProcessor
use_focal_loss: true
checkpoint_freq: 5
ECCriterion:
  weight_dict:
    loss_mal: 2.0
    loss_bbox: 1
    loss_giou: 1
    loss_fgl: 0.15
    loss_ddf: 1.5
    loss_mask_ce: 5.0
    loss_mask_dice: 5.0
  losses:
  - mal
  - boxes
  - local
  - masks
  gamma: 1.5
  alpha: 0.75
  reg_max: 32
  matcher:
    type: HungarianMatcher
    weight_dict:
      cost_class: 2
      cost_bbox: 1
      cost_giou: 1
      cost_mask_ce: 5
      cost_mask_dice: 5
    alpha: 0.25
    gamma: 2.0
    mask_point_sample_ratio: 16
eval_spatial_size:
- 640
- 640
print_freq: 50
output_dir: outputs/smf_ecseg
sync_bn: false
find_unused_parameters: false
use_amp: true
scaler:
  type: GradScaler
  enabled: true
use_ema: true
ema:
  type: ModelEMA
  decay: 0.9999
  warmups: 1000
  start: 0
clip_max_norm: 0.1
optimizer:
  type: AdamW
  params:
  - params: ^backbone\.(?!detail_)(?!.*(?:norm|bn|bias)).*$
    lr: 2.5e-05
  - params: ^backbone\.(?!detail_)(?=.*(?:norm|bn|bias)).*$
    lr: 2.5e-05
    weight_decay: 0.0
  - params: ^(?!backbone\.(?!detail_))(?=.*(?:norm|bn|bias)).*$
    weight_decay: 0.0
  lr: 0.0005
  betas:
  - 0.9
  - 0.999
  weight_decay: 0.0001
epochs: 74
lrsheduler: flatcosine
lr_gamma: 0.5
warmup_iter: 2000
flat_epoch: null
ViTAdapter:
  name: ecseg_vitt
  embed_dim: 192
  num_heads: 3
  interaction_indexes:
  - 10
  - 11
  weights_path: ''
ECSeg:
  backbone: ViTAdapter
  encoder: HybridEncoder
  decoder: ECTransformer
device: cuda:0
ECGraph:
  yaml_path: ''
  skip_load_backbone: true
