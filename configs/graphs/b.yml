    csp_type: csp2
decoder:
- - - 12
    - 15
    - 18
  - ECTransformer
  - feat_channels:
    - 192
    - 192
    - 192
    feat_strides:
    - 8
    - 16
    - 32
    hidden_dim: 192
    num_levels: 3
    num_layers: 4
    eval_idx: -1
    num_queries: 300
    num_denoising: 100
    label_noise_ratio: 0.5
    box_noise_scale: 1.0
    reg_max: 32
    reg_scale: 4
    layer_scale: 1
    num_points:
    - 3
    - 6
    - 3
    cross_attn_method: default
    query_select_method: default
    activation: silu
    dim_feedforward: 512
    mask_downsample_ratio: 4
    nhead: 8
