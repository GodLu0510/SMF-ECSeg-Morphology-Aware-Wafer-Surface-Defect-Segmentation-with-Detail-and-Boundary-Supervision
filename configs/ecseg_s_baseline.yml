__include__:
- common.yml
model: ECGraph
ECGraph:
  yaml_path: ../configs/graphs/baseline.yml
  skip_load_backbone: true
output_dir: outputs/ecseg_s_baseline
ablation:
  variant: baseline
  A_detail: false
  B_morphology: false
  C_supervision: false
ECCriterion:
  wafer_mask_supervision: false
  wafer_foreground_fraction: 0.25
  wafer_boundary_fraction: 0.25
  wafer_boundary_radius: 2
  wafer_boundary_tolerance: 1
  weight_dict:
    loss_mask_boundary: 0.0
